# Собирает сайт глубокого режима (site/, Docusaurus) и публикует на GitHub Pages.
# Включить один раз: Settings → Pages → Source = «GitHub Actions».
# Адрес: https://7sarkel7.github.io/Stupeni/

name: Deploy web (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-web.yml
      - site/**
      - content/deep/**
  pull_request:
    paths:
      - .github/workflows/deploy-web.yml
      - site/**
      - content/deep/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        run: npm run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/build

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
